name: FitCoach
options:
  bundleIdPrefix: com.luludad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FitCoach:
    type: application
    platform: iOS
    sources:
      - "健身训练手册"
    dependencies:
      - target: FitCoachWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luludad.fitness
        INFOPLIST_FILE: "健身训练手册/Info.plist"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  FitCoachWidget:
    type: app-extension
    platform: iOS
    sources:
      - FitCoachWidget
      - path: "健身训练手册/FitnessAttributes.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luludad.fitness.widget
        INFOPLIST_FILE: FitCoachWidget/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
